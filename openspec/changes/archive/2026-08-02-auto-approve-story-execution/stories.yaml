change: auto-approve-story-execution
stories:
  - id: command-auto-flag
    title: Add --auto flag to opsx-story command
    description: |
      WHAT: Update commands/opsx-story.md so the story command documents the opt-in `--auto` flag per design D2. All three edits are prose-level.
      FILES:
        - modify: commands/opsx-story.md
      EDGE CASES:
        - input line wording exactly: "Optionally pass `--auto` to run the loop without pausing for confirmation between stories (interactive confirmation remains the default)"
        - Loop step: "if `--auto` was passed, continue without pausing; otherwise confirm with the user, repeat"
        - guardrail: "Keep going through stories until done or blocked; confirmation between stories applies in interactive mode only (`--auto` skips it)"
        - no other text in the command is altered
      CONTEXT: design.md D2 command edits; proposal.md (auto changes ONLY inter-story confirmation).
    acceptanceCriteria:
      - "commands/opsx-story.md input line documents --auto with interactive-as-default wording"
      - "the Loop step branches on --auto (continue without pausing) vs confirm-with-user"
      - "the guardrail states confirmation applies in interactive mode only"
    dependsOn: []
    taskRefs:
      - "1.1 Add `--auto` to the command's input line: \"Optionally pass `--auto` to run the loop without pausing for confirmation between stories (interactive confirmation remains the default)\""
      - "1.2 Update the Loop step: \"if `--auto` was passed, continue without pausing; otherwise confirm with the user, repeat\""
      - "1.3 Update the guardrail: \"Keep going through stories until done or blocked; confirmation between stories applies in interactive mode only (`--auto` skips it)\""

  - id: skill-auto-flag
    title: Add --auto flag to the story-driver skill
    description: |
      WHAT: Update skills/openspec-story-driver/SKILL.md so the skill documents the opt-in `--auto` flag per design D2. Three prose edits.
      FILES:
        - modify: skills/openspec-story-driver/SKILL.md
      EDGE CASES:
        - input line wording matches the command's (interactive remains default)
        - Phase 3 step 8: "If the run was started with `--auto`, skip the confirmation and continue to the next story automatically; all other stops (Phase 1 stories.md approval, ambiguity, MCP failure, blocked, complete) still apply"
        - Guardrails section gains a bullet: "Confirmation between stories applies in interactive mode only; `--auto` skips it (the loop still stops on ambiguity, MCP failure, blocked runs, and completion)"
        - no other text in the skill is altered
      CONTEXT: design.md D2 skill edits; specs/story-execution/spec.md (flag-only activation, preserved stops).
    acceptanceCriteria:
      - "SKILL.md input line documents --auto with interactive-as-default wording"
      - "Phase 3 step 8 documents auto-skip with all other stops preserved"
      - "Guardrails section contains the interactive-only confirmation bullet"
    dependsOn: []
    taskRefs:
      - "2.1 Add `--auto` to the skill's input line with the same wording as the command (interactive remains default)"
      - "2.2 Update Phase 3 step 8: \"If the run was started with `--auto`, skip the confirmation and continue to the next story automatically; all other stops (Phase 1 stories.md approval, ambiguity, MCP failure, blocked, complete) still apply\""
      - "2.3 Add a guardrails bullet: \"Confirmation between stories applies in interactive mode only; `--auto` skips it (the loop still stops on ambiguity, MCP failure, blocked runs, and completion)\""

  - id: verify-auto-wording
    title: Verify --auto documentation
    description: |
      WHAT: Run the verification pass for the change: grep both files for --auto, confirm interactive behavior unchanged, confirm preserved stops.
      FILES:
        - none (verification only; fix any failures in the file they originate from)
      EDGE CASES:
        - grep commands/opsx-story.md and skills/openspec-story-driver/SKILL.md: --auto present in input line, loop/step text, and guardrails in both files
        - interactive-mode wording unchanged except documented additions (no confirmation behavior removed)
        - wording in both files preserves Phase 1 stories.md approval, ambiguity stops, MCP-unreachable stops, blocked runs, and completion under --auto
      CONTEXT: tasks group 3; design D2.
    acceptanceCriteria:
      - "grep shows --auto in input line, loop/step text, and guardrails in both files"
      - "interactive-mode text is unchanged except the documented additions"
      - "preserved stops (stories.md approval, ambiguity, MCP, blocked, completion) are stated under --auto in both files"
    dependsOn:
      - command-auto-flag
      - skill-auto-flag
    taskRefs:
      - "3.1 Grep `commands/opsx-story.md` and `skills/openspec-story-driver/SKILL.md` for `--auto` — present in input line, loop/step text, and guardrails in both files"
      - "3.2 Confirm interactive-mode wording is unchanged except the documented additions (no confirmation behavior removed)"
      - "3.3 Confirm the wording in both files preserves Phase 1 stories.md approval, ambiguity stops, MCP-unreachable stops, blocked runs, and completion under `--auto`"
