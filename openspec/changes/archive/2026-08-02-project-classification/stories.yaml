change: project-classification
stories:
  - id: add-generate-project-flag
    title: Add required --project flag to generate
    description: |
      WHAT: Extend scripts/story_driver.clj so the `generate` subcommand accepts a required `--project <name>` flag, per design D3 and the harness-adapters CLI contract.
      FILES:
        - modify: scripts/story_driver.clj (parse-args generate spec, sub-usage, root-help)
      EDGE CASES:
        - generate invoked without --project → usage + "the following arguments are required: --project" on stderr, exit 2
        - --project as the last token (no value) → "argument --project: expected one argument", exit 2
        - --project followed by another flag (e.g. --project --root x) → "argument --project: expected one argument", exit 2
        - --project on parse-tasks/sync-tasks/append-state → "unrecognized arguments: --project", exit 2
      CONTEXT: design.md D3; specs/harness-adapters/spec.md CLI contract; existing parse-args structure in scripts/story_driver.clj (flags map, sub-usage map).
    acceptanceCriteria:
      - "generate without --project exits 2 and prints 'the following arguments are required: --project' on stderr"
      - "generate --project with no value or a flag as value exits 2 with 'argument --project: expected one argument' on stderr"
      - "generate -h and root -h show required --project PROJECT; --project on other subcommands exits 2"
    dependsOn: []
    taskRefs:
      - "1.1 Add `--project <name>` to the `generate` subcommand spec in `parse-args`: required flag, allowed on generate only; missing flag → usage + `the following arguments are required: --project` on stderr, exit 2; missing value or flag-as-value → `argument --project: expected one argument`, exit 2"
      - "1.4 Update `story_driver.clj` usage/help text (`generate` usage line gains required `--project PROJECT`; root help mentions the flag as required)"

  - id: project-scoped-seed
    title: Emit project-scoped seed statements
    description: |
      WHAT: Update scripts/story_driver.clj so `write-seed` threads the project through cmd-generate and emits project-scoped Cypher, per design D2/D3.
      FILES:
        - modify: scripts/story_driver.clj (write-seed signature + body, cmd-generate)
      EDGE CASES:
        - seed header comment gains a project line (e.g. "// project: \"...\"")
        - Story nodes keep the existing `ON CREATE SET` property block unchanged (title/description/acceptanceCriteria/taskRefs/status)
        - every HAS_STORY and DEPENDS_ON MATCH filters on all of id/change/project (or name/project for Change)
      CONTEXT: design.md D2/D3 exact statement forms; current write-seed in scripts/story_driver.clj.
      Emit exactly:
        MERGE (p:Project {name: <project>});
        MERGE (c:Change {name: <change>, project: <project>});
        MATCH (p:Project {name: <project>}), (c:Change {name: <change>, project: <project>})
        MERGE (p)-[:BELONGS_TO]->(c);
        MERGE (s:Story {id: <id>, change: <change>, project: <project>})
        ON CREATE SET s.title = ..., s.description = ..., s.acceptanceCriteria = ..., s.taskRefs = ..., s.status = "pending";
        MATCH (c:Change {name: <change>, project: <project>}), (s:Story {id: <id>, change: <change>, project: <project>})
        MERGE (c)-[:HAS_STORY]->(s);
        // DEPENDS_ON edges with three-property MATCHes
    acceptanceCriteria:
      - "generate --project emits MERGE (p:Project {name: ...}) and MERGE (c:Change {name: ..., project: ...}) plus the literal BELONGS_TO MATCH/MERGE pair"
      - "Story nodes merge as {id, change, project} with ON CREATE SET unchanged; HAS_STORY and DEPENDS_ON MATCHes use three-property filters"
      - "the seed header comment includes the project line"
    dependsOn:
      - add-generate-project-flag
    taskRefs:
      - "1.2 Thread `project` through `cmd-generate` into `write-seed`; update the seed header comment to include the project line"
      - "1.3 Update `write-seed` to emit project-scoped statements: `MERGE (p:Project {name: <project>});`, `MERGE (c:Change {name: <change>, project: <project>});`, literal `MATCH (p:Project ...), (c:Change ...) MERGE (p)-[:BELONGS_TO]->(c);`, `Story` nodes as `{id, change, project}` with `ON CREATE SET` unchanged, `HAS_STORY` and `DEPENDS_ON` MATCHes with three-property filters"

  - id: regenerate-seed-goldens
    title: Regenerate seed goldens with --project
    description: |
      WHAT: Regenerate scripts/test/fixtures/golden/story-seed.cypher from the new generate output and update the generate-parity tests to invoke --project.
      FILES:
        - modify: scripts/test/fixtures/golden/story-seed.cypher (regenerated)
        - modify: scripts/test_story_driver.clj (generate-golden-parity test)
      EDGE CASES:
        - use project name fixture-project when invoking generate in tests
        - stories.md output is unchanged by the --project change; confirm the golden stories.md still matches (do not regenerate it)
        - fixture change-root stories.yaml/tasks.md stay as-is
      CONTEXT: design.md D3; scripts/test_story_driver.clj existing golden tests; scripts/test/fixtures/change-root and golden dirs.
    acceptanceCriteria:
      - "golden story-seed.cypher is regenerated via `generate fixture-change --project fixture-project` and contains project-scoped statements"
      - "generate-parity tests invoke --project and compare byte-for-byte against the updated golden"
      - "golden stories.md is unchanged and still matches"
    dependsOn:
      - project-scoped-seed
    taskRefs:
      - "2.1 Regenerate `scripts/test/fixtures/golden/story-seed.cypher` from the new `generate --project fixture-project` output (and `stories.md` if unchanged confirm it); keep the fixture change-root stories.yaml/tasks.md as-is"
      - "2.2 Update `scripts/test_story_driver.clj` generate-parity tests to invoke `--project` and compare against the updated goldens"

  - id: parser-and-seed-shape-tests
    title: Test --project parsing and seed shape
    description: |
      WHAT: Add parser and seed-shape tests to scripts/test_story_driver.clj covering the new --project behavior.
      FILES:
        - modify: scripts/test_story_driver.clj (parser-rejection deftest, new seed-shape deftest)
      EDGE CASES:
        - generate without --project → exit 2, stderr contains "the following arguments are required: --project"
        - --project with no value → exit 2, "expected one argument"
        - --project --root <path> (flag as value) → exit 2, "expected one argument"
        - --project on parse-tasks, sync-tasks, append-state → exit 2, "unrecognized arguments: --project"
        - seed-shape test asserts the emitted cypher contains Project {name}, Change {name, project}, Story {id, change, project}, BELONGS_TO, and three-property HAS_STORY/DEPENDS_ON statements
      CONTEXT: design.md D3; existing parser-rejection deftest patterns in scripts/test_story_driver.clj.
    acceptanceCriteria:
      - "parser tests cover missing --project, missing value, flag-as-value, and --project on wrong subcommands — all exit 2 with the specified stderr text"
      - "a seed-shape test asserts Project/Change/Story identity properties, BELONGS_TO, and three-property HAS_STORY/DEPENDS_ON statements in the generated cypher"
      - "all new tests pass under `bb scripts/test_story_driver.clj`"
    dependsOn:
      - project-scoped-seed
    taskRefs:
      - "2.3 Add parser tests: `generate` without `--project` exits 2 with the required-flag message; `--project` with no value exits 2 with expected-one-argument; `--project --root <path>` (flag as value) exits 2 with expected-one-argument; `--project` on parse-tasks/sync-tasks/append-state is rejected (exit 2)"
      - "2.4 Add a seed-shape test asserting the emitted cypher contains `Project {name}`, `Change {name, project}`, `Story {id, change, project}`, `BELONGS_TO`, and three-property `HAS_STORY`/`DEPENDS_ON` statements"

  - id: skill-classify-project-docs
    title: Document project classification in the skill
    description: |
      WHAT: Update skills/openspec-story-driver/SKILL.md: add --project to generate invocations and add a "Classify the project" step per design D1/D4.
      FILES:
        - modify: skills/openspec-story-driver/SKILL.md
      EDGE CASES:
        - classification Cypher uses MERGE (p:Project {name: ...}) SET p.repoUrl = ..., p.techStack = [...], p.type = ... with full-overwrite semantics: values no longer derivable are written as null to clear them
        - D1 derivation documented: git origin → lowercase host/owner/repo preserving subgroups; strip scheme/userinfo/port/.git/query/fragment; local/<repo-dir> fallback when origin absent or unparseable; canonical across clones
        - D4 facts documented: type ∈ {tooling, agent, docs}; techStack lowercase/deduplicated/sorted with aliases (js→javascript, ts→typescript, py→python); repoUrl sanitized (strip userinfo/query/fragment, SSH→HTTPS on known forges, else omit)
      CONTEXT: design.md D1/D4; specs/story-graph/spec.md classification requirement.
    acceptanceCriteria:
      - "every generate invocation in SKILL.md passes --project <name>"
      - "a 'Classify the project' step documents D1 name derivation (origin forms, subgroup preservation, local fallback) and D4 facts (type vocabulary, techStack normalization, repoUrl sanitization)"
      - "the classification Cypher shows full-overwrite SET semantics with null-clearing for un-derivable values"
    dependsOn:
      - project-scoped-seed
    taskRefs:
      - "3.1 Update `skills/openspec-story-driver/SKILL.md`: `generate` invocations gain `--project <name>`; add a \"Classify the project\" step documenting D1 name derivation (git origin → host/owner/repo, subgroup preservation, local fallback, canonical across clones), D4 facts (type vocabulary, techStack normalization, repoUrl sanitization) and the classification Cypher with full-overwrite semantics (`MERGE (p:Project {name}) SET p.repoUrl = ..., p.techStack = [...], p.type = ...;` where values no longer derivable are written as `null` to clear them)"

  - id: skill-project-scoped-queries
    title: Make skill Cypher snippets project-scoped
    description: |
      WHAT: Update every Cypher snippet in skills/openspec-story-driver/SKILL.md so Change/Story matches are project-scoped per design D5.
      FILES:
        - modify: skills/openspec-story-driver/SKILL.md
      EDGE CASES:
        - seeding/resume guard matches (c:Change {name: ..., project: ...})-[:HAS_STORY]->(s:Story {project: ...})
        - next-runnable poll filters on change + project and DEPENDS_ON targets within the same change/project
        - status transitions use MATCH (s:Story {id: ..., change: ..., project: ...})
        - blocked/completion checks and the graph-schema reference section include the project property
        - no snippet matches Change or Story without a project filter
      CONTEXT: design.md D5; specs/story-graph + story-execution deltas; current snippets in SKILL.md.
    acceptanceCriteria:
      - "the seeding/resume guard, next-runnable poll, status transitions, blocked/completion checks, and graph-schema reference all filter Change/Story by project"
      - "no Cypher snippet in SKILL.md matches Change or Story without a project property"
    dependsOn:
      - project-scoped-seed
    taskRefs:
      - "3.2 Update every Cypher snippet in the SKILL.md to be project-scoped: seeding/resume guard, next-runnable poll, status transitions (`{id, change, project}`), blocked/completion checks, and the graph-schema reference section"

  - id: command-agents-project-updates
    title: Update opsx-story command and AGENTS.md
    description: |
      WHAT: Update commands/opsx-story.md and AGENTS.md for the --project flag and classification flow.
      FILES:
        - modify: commands/opsx-story.md
        - modify: AGENTS.md
      EDGE CASES:
        - opsx-story generate step derives the canonical project name from the repository's git origin per the story-graph classification contract (accepted URL forms, normalization, subgroup preservation, local/<dir> fallback) and passes it as --project
        - opsx-story workflow summary mentions project classification
        - AGENTS.md story-driver invocation list shows generate with --project: `generate <change> --project <name> [--root <changeRoot>] [--def <stories.yaml>]`
      CONTEXT: specs/harness-adapters/spec.md opsx-story scenario; AGENTS.md Scripts and tests section.
    acceptanceCriteria:
      - "opsx-story.md derives the canonical project name from git origin and passes it as --project, and mentions classification in the workflow summary"
      - "AGENTS.md invocation list includes generate <change> --project <name> [--root <changeRoot>] [--def <stories.yaml>]"
    dependsOn:
      - project-scoped-seed
    taskRefs:
      - "3.3 Update `commands/opsx-story.md`: the generate step derives the canonical project name from the repository's git `origin` per the story-graph classification contract (accepted URL forms, normalization, subgroup preservation, `local/<dir>` fallback) and passes it as `--project`; workflow summary mentions project classification"
      - "3.4 Update `AGENTS.md` story-driver invocation list: `generate <change> --project <name> [--root <changeRoot>] [--def <stories.yaml>]`"

  - id: full-verification
    title: Verify the project-classification implementation
    description: |
      WHAT: Run the full verification pass for the change: test suites, manual CLI checks, documentation greps, and optional graph idempotency.
      FILES:
        - none (verification only; fix any failures in the files they originate from)
      EDGE CASES:
        - bb scripts/test_story_driver.clj and bb scripts/test_config_merge.clj both pass with non-zero-exit enforcement
        - generate with --project produces project-scoped seed; generate without --project exits 2 with usage on stderr; generate -h shows --project as required
        - grep skills/openspec-story-driver/SKILL.md and commands/opsx-story.md: every generate invocation passes --project; classification step documents D1 derivation incl. local fallback, D4 full-overwrite/null-clearing, repoUrl sanitization; every Cypher snippet matches Change/Story with project
        - if a live graph is available, run the seed twice and confirm no duplicate Project/Change/Story nodes or edges
      CONTEXT: tasks group 4; design D1-D5.
    acceptanceCriteria:
      - "both bb test suites pass with zero failures"
      - "manual checks pass: seed with --project has project-scoped statements; without --project exits 2; generate -h shows required --project"
      - "documentation greps pass (all generate invocations pass --project; classification docs cover D1/D4; all Cypher snippets project-scoped)"
    dependsOn:
      - regenerate-seed-goldens
      - parser-and-seed-shape-tests
      - skill-classify-project-docs
      - skill-project-scoped-queries
      - command-agents-project-updates
    taskRefs:
      - "4.1 Run `bb scripts/test_story_driver.clj` and `bb scripts/test_config_merge.clj` — all assertions pass"
      - "4.2 Manual check: run `generate` with `--project`, inspect `story-seed.cypher` for the project-scoped statements; run `generate` without `--project` and confirm exit 2 + usage on stderr; confirm `generate -h` shows `--project` as required"
      - "4.3 Documentation verification: grep `skills/openspec-story-driver/SKILL.md` and `commands/opsx-story.md` — every `generate` invocation passes `--project`; the classification step documents D1 derivation (incl. local fallback), D4 full-overwrite/null-clearing, and repoUrl sanitization; every Cypher snippet in the skill matches `Change`/`Story` with a `project` property"
      - "4.4 If a live graph is available, run the seed twice and confirm idempotency (no duplicate Project/Change/Story nodes or edges)"
